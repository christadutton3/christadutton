<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christa Dutton</title>
  <meta name="description" content="Christa Dutton, campaigns reporter at The Washington Sun.">
  <style>
    :root {
      --bg: #fbfaf7;
      --text: #1c1b19;
      --muted: #5f5b54;
      --rule: #dcd8cf;
      --accent: #8a1c1c;
      --placeholder-bg: #f1eee6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --text: #eeece7;
        --muted: #a8a49c;
        --rule: #34322e;
        --accent: #e07a6e;
        --placeholder-bg: #1e1d1b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.125rem;
      line-height: 1.6;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 16px 80px;
    }
    header {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 28px;
      margin-bottom: 40px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.25rem, 7vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .beat {
      margin: 0;
      color: var(--muted);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1.05rem;
    }
    section { margin-bottom: 44px; }
    h2 {
      margin: 0 0 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .placeholder {
      margin: 0;
      padding: 16px 18px;
      border: 1px dashed var(--rule);
      border-radius: 6px;
      background: var(--placeholder-bg);
      color: var(--muted);
      font-style: italic;
    }
    .clips {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .clips li {
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
    }
    .clips a { color: var(--text); font-weight: 700; }
    .clips .meta {
      display: block;
      color: var(--muted);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 0.9rem;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    footer {
      border-top: 1px solid var(--rule);
      padding-top: 24px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Christa Dutton</h1>
      <p class="beat">Campaigns reporter at The Washington Sun</p>
    </header>

    <section id="about">
      <h2>About</h2>
      <!-- ABOUT: replace the placeholder paragraph below with your bio. -->
      <p class="placeholder">[About section — text coming soon]</p>
    </section>

    <section id="clips">
      <h2>Clips</h2>
      <!--
        CLIPS: add each story as a list item inside the <ul> below, like this:
        <li>
          <a href="https://example.com/story">Story headline</a>
          <span class="meta">The Washington Sun · Month Day, Year</span>
        </li>
        Then delete the placeholder paragraph.
      -->
      <ul class="clips"></ul>
      <p class="placeholder">[Clips coming soon]</p>
    </section>

    <footer>
      <p>Reach me at <a href="mailto:christadutton@washsun.com">christadutton@washsun.com</a>.</p>
    </footer>
  </main>
</body>
</html>
